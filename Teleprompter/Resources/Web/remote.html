<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prompter Remote">
<meta name="theme-color" content="#090E14">
<title>Prompter Remote</title>
<link rel="stylesheet" href="prompter.css">
<style>
  body {
    padding: max(var(--s4), env(safe-area-inset-top)) max(var(--s4), env(safe-area-inset-right))
             max(var(--s6), env(safe-area-inset-bottom)) max(var(--s4), env(safe-area-inset-left));
    max-width: 560px; margin: 0 auto; -webkit-user-select: none; user-select: none;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s4); }
  section { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s4); margin-bottom: var(--s4); }
  section > h2 { margin: 0 0 var(--s3); }
  [hidden] { display: none !important; }
  .row { display: flex; align-items: center; gap: var(--s3); }
  .between { justify-content: space-between; }
  .grow { flex: 1; min-width: 0; }
  .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .transport { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--s2); margin: var(--s4) 0 var(--s2); }
  .transport .side { display: flex; gap: var(--s1); }
  .transport .side:last-child { justify-content: flex-end; }
  #play { --h: 64px; min-width: 150px; font-size: 14px; }
  #play .icon { width: 22px; height: 22px; }
  /* A small copy of the prompter, scrolling as the prompter does (never mirrored). */
  .now {
    position: relative; margin-top: var(--s3); height: 200px; overflow: hidden;
    border-radius: var(--r-md); border: 1px solid var(--line);
  }
  .now .stage { position: absolute; }
  .readouts { display: flex; justify-content: space-between; margin-top: var(--s2); }
  .stepper { display: inline-flex; align-items: center; gap: var(--s2); }
  .stepper output { min-width: 5.5em; text-align: center; }
  .scripts { list-style: none; margin: 0; padding: 0; }
  .scripts li + li { border-top: 1px solid var(--line); }
  .scripts button {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
    min-height: 52px; padding: var(--s2) 0; border: 0; background: none; text-align: left; cursor: pointer;
  }
  .scripts button:disabled { opacity: 0.4; }
  .scripts .on { color: var(--accent); }
  .settings-grid { display: grid; gap: var(--s3); }
  .countdown-chip { font-size: 13px; color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
<header>
  <div>
    <p class="t-eyebrow subtle" style="margin:0">Prompter remote</p>
    <span id="link" class="status idle">Connecting</span>
  </div>
  <button id="close" class="btn" type="button" hidden>
    <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    Close
  </button>
</header>

<section id="session" hidden aria-labelledby="script-title">
  <div class="row between">
    <h1 id="script-title" class="t-subheading title grow"></h1>
    <span id="state-chip" class="status idle"></span>
  </div>

  <div class="now" aria-hidden="true"><div id="preview"></div></div>

  <div class="transport">
    <div class="side">
      <button class="btn btn-quiet" data-cmd="restart" type="button" aria-label="Restart from the beginning">
        <svg class="icon icon-lg" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
      <button class="btn btn-quiet" data-cmd="rewind" type="button" aria-label="Back one sentence">
        <svg class="icon icon-lg" viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" x2="5" y1="19" y2="5"/></svg>
      </button>
    </div>
    <button id="play" class="btn btn-primary" data-cmd="toggle" type="button">
      <svg class="icon" id="play-icon" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3" fill="currentColor"/></svg>
      <span id="play-label">Play</span>
    </button>
    <div class="side">
      <button class="btn btn-quiet" data-cmd="skip" type="button" aria-label="Ahead one sentence">
        <svg class="icon icon-lg" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" x2="19" y1="5" y2="19"/></svg>
      </button>
    </div>
  </div>

  <label class="t-label subtle" for="scrub">Position</label>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <div class="readouts t-mono subtle">
    <span id="percent">0%</span>
    <span id="remaining">0:00 left</span>
  </div>
</section>

<section id="playback" hidden>
  <h2 class="t-label subtle">Playback</h2>
  <div class="settings-grid">
    <div class="row between">
      <span>Mode</span>
      <div class="segmented" role="group" aria-label="Mode">
        <button type="button" data-mode="voiceFollow" aria-pressed="false">Voice</button>
        <button type="button" data-mode="timed" aria-pressed="false">Timed</button>
      </div>
    </div>
    <div class="row between" id="speed-row">
      <span>Speed</span>
      <span class="stepper">
        <button class="btn btn-quiet" data-cmd="speed" data-value="-10" type="button" aria-label="Slower"><svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <output id="wpm" class="t-mono">140 WPM</output>
        <button class="btn btn-quiet" data-cmd="speed" data-value="10" type="button" aria-label="Faster"><svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </span>
    </div>
    <div class="row between">
      <span>Text size</span>
      <span class="stepper">
        <button class="btn btn-quiet" data-cmd="fontSize" data-value="-4" type="button" aria-label="Smaller text"><svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <output id="size" class="t-mono">44 pt</output>
        <button class="btn btn-quiet" data-cmd="fontSize" data-value="4" type="button" aria-label="Larger text"><svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </span>
    </div>
    <div class="row between">
      <span>Mirror host screen</span>
      <button class="btn btn-quiet" id="host-mirror" data-cmd="mirror" type="button" aria-pressed="false">
        <svg class="icon" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"/><path d="M12 20v2"/><path d="M12 14v2"/><path d="M12 8v2"/><path d="M12 2v2"/></svg>
        <span>Off</span>
      </button>
    </div>
  </div>
</section>

<section>
  <h2 class="t-label subtle">iPad display</h2>
  <div class="settings-grid">
    <div class="row between">
      <span>Mirror display</span>
      <button class="btn btn-quiet" id="display-mirror" data-cmd="displayMirror" type="button" aria-pressed="false"><span>Off</span></button>
    </div>
    <div class="row between">
      <span>Flip upside down</span>
      <button class="btn btn-quiet" id="display-flip" data-cmd="displayFlip" type="button" aria-pressed="false"><span>Off</span></button>
    </div>
    <div class="row between">
      <span>Display text size</span>
      <span class="stepper">
        <button class="btn btn-quiet" data-cmd="displayScale" data-value="-0.1" type="button" aria-label="Smaller on the display"><svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <output id="display-scale" class="t-mono">100%</output>
        <button class="btn btn-quiet" data-cmd="displayScale" data-value="0.1" type="button" aria-label="Larger on the display"><svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </span>
    </div>
  </div>
</section>

<section aria-labelledby="scripts-heading">
  <h2 id="scripts-heading" class="t-label subtle">Scripts</h2>
  <ul id="scripts" class="scripts"></ul>
  <p id="no-scripts" class="muted" hidden>No scripts in the library yet.</p>
</section>

<script src="prompter.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  let script = { id: null, text: "", tokens: [] };
  let state = { session: false };
  let scrubbing = false;

  function send(action, extra) {
    return fetch("command", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ action }, extra || {}))
    }).catch(() => setLink("Not connected", "bad"));
  }

  document.body.addEventListener("click", (e) => {
    const b = e.target.closest("[data-cmd]");
    if (b) {
      const v = b.dataset.value;
      send(b.dataset.cmd, v !== undefined ? { value: parseFloat(v) } : null);
      return;
    }
    const m = e.target.closest("[data-mode]");
    if (m) send("mode", { mode: m.dataset.mode });
  });
  $("close").addEventListener("click", () => send("close"));

  const scrub = $("scrub");
  scrub.addEventListener("input", () => (scrubbing = true));
  scrub.addEventListener("change", () => {
    send("seek", { value: scrub.value / 1000 });
    setTimeout(() => (scrubbing = false), 400);
  });

  function setLink(text, kind) {
    $("link").textContent = text;
    $("link").className = "status " + kind;
  }

  function fmt(seconds) {
    const t = Math.max(0, Math.round(seconds)), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    const pad = (n) => String(n).padStart(2, "0");
    return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
  }

  function toggle(el, on) {
    el.setAttribute("aria-pressed", on ? "true" : "false");
    const label = el.querySelector("span");
    if (label) label.textContent = on ? "On" : "Off";
  }

  /* The preview: the prompter's own stage at phone size, fed the same
     positions as the iPad display. Timed mode scrolls at one steady speed with
     nothing marked; Voice Follow shows the app's highlight. */
  const preview = new Prompter.PrompterStage($("preview"));
  const follower = new Prompter.Follower(preview);
  preview.onRelayout = () => follower.resync();

  function renderPreview() {
    if (!state.session) return;
    follower.push(state.position, state.state === "playing", state.mode === "timed" ? state.timed : null);
    preview.setHighlight(state.readUpTo, state.current);
  }

  function renderState() {
    const on = state.session;
    $("session").hidden = !on;
    $("playback").hidden = !on;
    $("close").hidden = !on;
    document.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.mode === state.mode ? "true" : "false"));
    $("wpm").textContent = Math.round(state.wordsPerMinute || 0) + " WPM";
    $("speed-row").hidden = state.mode !== "timed";
    toggle($("host-mirror"), !!state.mirror);
    markOpen();
    if (!on) return;
    const running = state.state === "playing" || state.state === "countdown";
    $("play-label").textContent = running ? "Pause" : state.state === "finished" ? "Again" : "Play";
    $("play-icon").innerHTML = running
      ? '<rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/><rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/>'
      : '<polygon points="6 3 20 12 6 21 6 3" fill="currentColor"/>';
    const chip = $("state-chip");
    const labels = { ready: ["Ready", "idle"], countdown: ["Starting " + (state.countdown || ""), "warn"], playing: ["Live", "ok"], paused: ["Paused", "idle"], finished: ["Finished", "idle"] };
    let [label, kind] = labels[state.state] || ["", "idle"];
    if (state.state === "playing" && state.mode === "voiceFollow") {
      const tracking = { following: ["Following", "ok"], waiting: ["Listening", "ok"], starting: ["Starting mic", "warn"], findingPlace: ["Finding place", "warn"], unavailable: ["Mic unavailable", "bad"] }[state.tracking];
      if (tracking) [label, kind] = tracking;
    }
    chip.textContent = label;
    chip.className = "status " + kind;
    if (!scrubbing) scrub.value = Math.round((state.progress || 0) * 1000);
    $("percent").textContent = Math.round((state.progress || 0) * 100) + "%";
    $("remaining").textContent = fmt(state.remaining || 0) + " left";
    renderPreview();
  }

  function markOpen() {
    document.querySelectorAll("#scripts button").forEach((b) => {
      const open = state.session && b.dataset.id === state.scriptID;
      b.querySelector(".tag").textContent = open ? "Open" : "Present";
      b.querySelector(".tag").className = "tag t-label " + (open ? "on" : "subtle");
    });
  }

  const events = new EventSource("events");
  events.addEventListener("open", () => setLink("Connected", "ok"));
  events.addEventListener("error", () => setLink("Reconnecting", "warn"));
  events.addEventListener("script", (e) => {
    const s = JSON.parse(e.data);
    if (s.id !== script.id || s.text !== script.text) preview.setScript(s.text || "", s.tokens || [], s.cues || []);
    script = { id: s.id, text: s.text || "", tokens: s.tokens || [] };
    $("script-title").textContent = s.title || "";
  });
  events.addEventListener("state", (e) => { state = JSON.parse(e.data); renderState(); });
  events.addEventListener("style", (e) => {
    const s = JSON.parse(e.data);
    // Same look as the prompter, sized for the phone and never mirrored or flipped.
    preview.setStyle(Object.assign({}, s, {
      fontSize: Math.min(Math.max(s.fontSize * 0.45, 17), 26),
      display: { mirror: false, flip: false, scale: 1 }
    }));
    $("size").textContent = Math.round(s.fontSize) + " pt";
    toggle($("display-mirror"), s.display.mirror);
    toggle($("display-flip"), s.display.flip);
    $("display-scale").textContent = Math.round(s.display.scale * 100) + "%";
  });
  events.addEventListener("library", (e) => {
    const list = JSON.parse(e.data).scripts;
    const ul = $("scripts");
    ul.innerHTML = "";
    $("no-scripts").hidden = list.length > 0;
    for (const item of list) {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.id = item.id;
      b.disabled = item.isEmpty;
      b.innerHTML = `<span class="grow"><span class="t-subheading title" style="display:block"></span><span class="t-body-small subtle"></span></span><span class="tag t-label subtle"></span>`;
      b.querySelector(".t-subheading").textContent = item.title;
      b.querySelector(".t-body-small").textContent = item.isEmpty ? "Empty" : item.words.toLocaleString() + " words";
      b.addEventListener("click", () => send("open", { id: item.id }));
      li.appendChild(b);
      ul.appendChild(li);
    }
    markOpen();
  });
})();
</script>
</body>
</html>
